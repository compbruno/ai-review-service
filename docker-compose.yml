services:
  gerrit:
    image: gerritcodereview/gerrit:3.10.0
    container_name: gerrit
    ports:
      - "8081:8080"
      - "29418:29418"
    environment:
      - CANONICAL_WEB_URL=http://localhost:8081
    volumes:
      - gerrit_data:/var/gerrit/review_site
    networks:
      - review-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 5

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - review-net
    depends_on:
      gerrit:
        condition: service_healthy

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - review-net

  datadog:
    image: gcr.io/datadoghq/agent:7
    container_name: dd-agent
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=${DD_SITE:-datadoghq.com}
      - DD_ENV=${DD_ENV:-local}
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
      - DD_LOGS_ENABLED=true
      - DD_CONTAINER_EXCLUDE=name:dd-agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    networks:
      - review-net

  ai-review:
    build:
      context: .
      dockerfile: dockerfile
    container_name: ai-review
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - GERRIT_URL=http://gerrit:8080
      - OLLAMA_URL=http://ollama:11434
      - DD_AGENT_HOST=dd-agent
      - DD_DOGSTATSD_PORT=8125
      - DD_SERVICE=ai-review-service
      - DD_ENV=${DD_ENV:-local}
      - DD_VERSION=1.0.0
      - DD_TRACE_ENABLED=true
      - DD_LOGS_INJECTION=true
      - DD_RUNTIME_METRICS_ENABLED=true
    labels:
      com.datadoghq.ad.logs: '[{"source":"nodejs","service":"ai-review-service"}]'
    networks:
      - review-net
    depends_on:
      gerrit:
        condition: service_healthy
      datadog:
        condition: service_started

volumes:
  gerrit_data:
  jenkins_data:
  ollama_data:

networks:
  review-net:
    driver: bridge
